name: Deploy a Canary Build
on:
  workflow_dispatch:
    branches-ignore:
      - main

permissions:
  # id-token: write is intentionally omitted here. npm auto-attempts OIDC
  # Trusted Publishing when this permission is present, but the theme
  # packages (es-components-wtw-theme, es-components-via-theme,
  # es-components-wtw-legacy-theme) don't have a Trusted Publisher linked
  # on npmjs.com yet, causing canary publishes to fail with E404. Omitting
  # this permission forces npm to fall back to the classic NPM_TOKEN auth
  # below for all packages. Once Trusted Publishing is configured for the
  # theme packages, this can be restored.
  contents: write
  actions: write
  attestations: write

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  deploy_canary:
    name: Build And Deploy Canary Release
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PIPELINE_BOT_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: |
          npm ci --prefer-offline --no-audit

      - name: Set Commitbot Identity
        run: |
          git config user.name "ES-Components Lerna Publish Bot"
          git config user.email "es-components-bot@wtw.org"

      - name: Lerna Publish
        run: |
          preId=$(git rev-parse --abbrev-ref HEAD | tr "[:upper:]" "[:lower:]")
          echo "Publishing a canary release..."
          npx lerna publish \
            --canary \
            --force-publish \
            --preid canary-$preId \
            --conventional-commits \
            --changelog-preset @aabenoja/conventional-changelog-eslint-lerna \
            --yes
