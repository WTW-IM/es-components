name: Deploy a Canary Build
on:
  workflow_dispatch:
    branches-ignore:
      - main

permissions:
  id-token: write # Required for OIDC
  contents: write
  actions: write
  attestations: write

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  deploy_canary:
    name: Build And Deploy Canary Release
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PIPELINE_BOT_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: |
          npm ci --prefer-offline --no-audit

      - name: Set Commitbot Identity
        run: |
          git config user.name "ES-Components Lerna Publish Bot"
          git config user.email "es-components-bot@wtw.org"

      # The theme packages' npm Trusted Publishing is registered for a
      # different workflow file, so they get rejected (E403) when
      # publishing from this one. Marking them private makes lerna skip
      # them so es-components can still publish a canary build on its
      # own. lerna requires a clean working tree before publishing, so
      # this change is committed locally in this ephemeral CI checkout
      # only (never pushed to origin). Remove this step once Trusted
      # Publishing is reworked to cover all publish workflows.
      - name: Exclude unpublishable theme packages
        run: |
          for pkg in es-components-wtw-theme es-components-via-theme es-components-wtw-legacy-theme; do
            npm pkg set --json "private=true" --prefix "packages/$pkg"
          done
          git commit -am "Build: [skip ci][skip-release] temporarily mark unpublishable theme packages private for canary"

      - name: Lerna Publish
        run: |
          preId=$(git rev-parse --abbrev-ref HEAD | tr "[:upper:]" "[:lower:]")
          echo "Publishing a canary release..."
          npx lerna publish \
            --canary \
            --force-publish \
            --preid canary-$preId \
            --conventional-commits \
            --changelog-preset @aabenoja/conventional-changelog-eslint-lerna \
            --yes
