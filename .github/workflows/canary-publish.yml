name: Deploy a Canary Build
on:
  workflow_dispatch:
    branches-ignore:
      - main

permissions:
  # id-token: write is intentionally omitted here. npm auto-attempts OIDC
  # Trusted Publishing when this permission is present. Removing it alone
  # was NOT sufficient to fix theme package publishes (confirmed: the
  # classic NPM_TOKEN below also gets E404 for them, meaning that token's
  # granted scope doesn't include the theme packages at all). See the
  # "Exclude unpublishable theme packages" step below for the actual
  # workaround. Once an admin either widens NPM_TOKEN's scope or sets up
  # Trusted Publishing for the theme packages, both this and that step
  # can be removed.
  contents: write
  actions: write
  attestations: write

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

jobs:
  deploy_canary:
    name: Build And Deploy Canary Release
    runs-on: ubuntu-latest
    environment: canary
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PIPELINE_BOT_PAT }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: |
          npm ci --prefer-offline --no-audit

      - name: Set Commitbot Identity
        run: |
          git config user.name "ES-Components Lerna Publish Bot"
          git config user.email "es-components-bot@wtw.org"

      # The NPM_TOKEN used here does not have publish access to the theme
      # packages (es-components-wtw-theme, es-components-via-theme,
      # es-components-wtw-legacy-theme), which always fails canary
      # publishing with npm E404. Marking them private (in this CI
      # checkout only, never committed) makes lerna skip them so
      # es-components can still publish a canary build on its own.
      # Remove this step once an admin fixes the theme packages' npm
      # publish access.
      - name: Exclude unpublishable theme packages
        run: |
          for pkg in es-components-wtw-theme es-components-via-theme es-components-wtw-legacy-theme; do
            npm pkg set --json "private=true" --prefix "packages/$pkg"
          done

      - name: Lerna Publish
        run: |
          preId=$(git rev-parse --abbrev-ref HEAD | tr "[:upper:]" "[:lower:]")
          echo "Publishing a canary release..."
          npx lerna publish \
            --canary \
            --force-publish \
            --preid canary-$preId \
            --conventional-commits \
            --changelog-preset @aabenoja/conventional-changelog-eslint-lerna \
            --yes
